name: Build ImmortalWrt 24.10.6 RouterOS Bypass Stable V1.1

on:
  workflow_dispatch:
    inputs:
      install_openbox:
        description: Install Open-Box during image customization
        required: false
        default: "false"
      install_extra_proxy:
        description: Include extra proxy stacks
        required: false
        default: "false"
      publish_release:
        description: Publish GitHub Release
        required: false
        default: "false"

env:
  IMMORTAL_VERSION: "24.10.6"
  TARGET: "x86"
  SUBTARGET: "64"
  ROOTFS_PARTSIZE: "4096"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zstd file wget curl

      - name: Clone ImmortalWrt
        run: |
          git clone --depth=1 --branch v24.10.6 https://github.com/immortalwrt/immortalwrt.git source

      - name: Apply RouterOS bypass configuration
        working-directory: source
        run: |
          cat > .config <<'EOF'
CONFIG_TARGET_x86=y
CONFIG_TARGET_x86_64=y
CONFIG_TARGET_IMAGES_GPT=y
CONFIG_TARGET_ROOTFS_PARTSIZE=4096

CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-compat=y
CONFIG_PACKAGE_luci-base=y

CONFIG_PACKAGE_bash=y
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_ca-bundle=y
CONFIG_PACKAGE_unzip=y
CONFIG_PACKAGE_ip-full=y
CONFIG_PACKAGE_dnsmasq-full=y

CONFIG_PACKAGE_kmod-tun=y
CONFIG_PACKAGE_kmod-nft-tproxy=y
CONFIG_PACKAGE_kmod-inet-diag=y

CONFIG_PACKAGE_tcpdump=y
CONFIG_PACKAGE_libustream-mbedtls20201210=y

CONFIG_PACKAGE_luci-app-openclash=y
EOF

          if [ "${{ github.event.inputs.install_extra_proxy }}" = "true" ]; then
            echo "Extra proxy packages enabled"
          fi

      - name: Build firmware
        working-directory: source
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make download -j$(nproc)
          make -j$(nproc) V=s

      - name: Collect firmware
        run: |
          mkdir -p artifact
          cp source/bin/targets/x86/64/* artifact/ || true
          sha256sum artifact/* > artifact/SHA256SUMS || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-24.10.6-RouterOS-Bypass-V1.1-x86_64-4G-EFI
          path: artifact
